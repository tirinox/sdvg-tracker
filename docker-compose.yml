services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_PATH: /data/sdvg.db
    volumes:
      - data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-8420}:80"
    restart: unless-stopped

volumes:
  data:
