services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/sdvg.db
      # Uvicorn only believes X-Forwarded-For/-Proto from these addresses. Safe as "*":
      # only nginx in the web container can reach the backend.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - data:/data
    expose:
      - "8000"
    networks:
      default:
        aliases: [sdvg-backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-8420}:80"
    restart: unless-stopped

volumes:
  data:
