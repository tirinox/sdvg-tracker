# The scheme the client used: from the proxy in front (the ingress in production), else our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Behind a proxy the peer is the proxy: take the client address from X-Forwarded-For when
    # the peer is on a private (container or LAN) network. Nothing else can reach this port.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    location /api/ {
        # Not plain "backend": the web container is also on the host's shared network, where
        # another project's service could have that name.
        proxy_pass http://sdvg-backend:8000;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Morning videos for the iOS app: video/ beside the checkout, kept out of git (make videos-deploy).
    location /video/ {
        root /srv;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
